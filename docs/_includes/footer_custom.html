<div id="translate">Language: <span id="translate-fallback">loading…</span></div>
<script>
  (function () {
    // 多 CDN 兑底：res.zvo.cn 不可达时退到 jsdelivr
    var URLS = [
      'https://res.zvo.cn/translate/translate.js',
      'https://cdn.jsdelivr.net/gh/xnx3/translate/translate.js'
    ];
    var idx = 0;
    var done = false;

    function initTranslate() {
      if (typeof translate === 'undefined') return false;
      try {
        translate.setUseVersion2();
        // 网页源语言（文档本身是中文撰写）
        translate.language.setLocal('chinese_simplified');
        // 只允许这 4 种语言：中、英、日、德
        translate.selectLanguageTag.languages = 'chinese_simplified,english,japanese,german';
        // 首次访问默认翻译为英文（已选过语言的用户会保持其选择）
        translate.language.setDefaultTo('english');
        translate.listener.start();
        translate.execute();
      } catch (e) {
        console.warn('translate init failed:', e);
        return false;
      }
      var fb = document.getElementById('translate-fallback');
      if (fb) fb.style.display = 'none';
      done = true;
      return true;
    }

    function loadNext() {
      if (idx >= URLS.length) {
        var fb = document.getElementById('translate-fallback');
        if (fb) fb.textContent = 'unavailable (network)';
        return;
      }
      var s = document.createElement('script');
      s.src = URLS[idx++];
      s.async = true;
      s.onload = function () {
        if (!initTranslate()) loadNext();
      };
      s.onerror = function () { loadNext(); };
      document.head.appendChild(s);
    }
    loadNext();

    // 8 秒兑底提示：如果还没初始化成功，提醒用户网络慢
    setTimeout(function () {
      if (done) return;
      var fb = document.getElementById('translate-fallback');
      if (fb && fb.textContent.indexOf('loading') !== -1) {
        fb.textContent = '(slow network, please wait…)';
      }
    }, 8000);
  })();
</script>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>

<script>
  (function () {
    function loadScript(urls, onDone) {
      var i = 0;
      function tryNext() {
        if (i >= urls.length) {
          return;
        }
        var url = urls[i++];
        var s = document.createElement('script');
        s.src = url;
        s.async = true;
        s.onload = function () { onDone && onDone(); };
        s.onerror = function () { tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    }

    function typesetMath() {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetClear && window.MathJax.typesetClear();
        window.MathJax.typesetPromise();
      }
    }

    loadScript([
      'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js',
      'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js',
      'https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js'
    ], function () {
      typesetMath();
      setTimeout(typesetMath, 500);
      setTimeout(typesetMath, 1500);
    });

    loadScript([
      'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js',
      'https://unpkg.com/mermaid@10/dist/mermaid.min.js'
    ], function () {
      if (window.mermaid) {
        window.mermaid.initialize({ startOnLoad: false });
      }
    });

    // If translate.js mutates DOM after load, re-typeset once more.
    window.addEventListener('load', function () {
      setTimeout(typesetMath, 2500);
    });
  })();
</script>

<script>
  function renderMermaidFromCodeFences() {
    var blocks = document.querySelectorAll('pre > code.language-mermaid');
    blocks.forEach(function (code) {
      var pre = code.parentElement;
      var container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = code.textContent;
      pre.parentElement.replaceChild(container, pre);
    });

    if (window.mermaid) {
      window.mermaid.initialize({ startOnLoad: false });
      window.mermaid.run({ querySelector: '.mermaid' });
    }
  }

  window.addEventListener('load', function () {
    renderMermaidFromCodeFences();
  });
</script>
