<div id="translate">Language: <span id="translate-fallback">loading…</span></div>
<script>
  (function () {
    // 多 CDN 兑底：res.zvo.cn 不可达时退到 jsdelivr
    var URLS = [
      'https://res.zvo.cn/translate/translate.js',
      'https://cdn.jsdelivr.net/gh/xnx3/translate/translate.js'
    ];
    var LS_KEY = 'wikiLang';                // localStorage 中存放用户语言偏好
    var DEFAULT_LANG = 'english';           // 首次访问默认语言
    var SOURCE_LANG = 'chinese_simplified'; // 源语言（不翻译）
    var ALLOWED = 'chinese_simplified,english,japanese,german';

    var idx = 0;
    var box = document.getElementById('translate');
    var fb = document.getElementById('translate-fallback');

    function readSavedLang() {
      try { return localStorage.getItem(LS_KEY); } catch (_) { return null; }
    }
    function writeSavedLang(v) {
      try { localStorage.setItem(LS_KEY, v); } catch (_) {}
    }

    // —— 鲁棒地隐藏 loading：只要 #translate 里出现 select，就认为加载成功 ——
    if (box && window.MutationObserver) {
      var ob = new MutationObserver(function () {
        var sel = box.querySelector('select');
        if (!sel) return;
        if (fb) fb.style.display = 'none';
        // 监听用户主动切换 → 持久化偏好
        if (!sel.__bound) {
          sel.__bound = true;
          sel.addEventListener('change', function () {
            writeSavedLang(sel.value);
          });
        }
        ob.disconnect();
      });
      ob.observe(box, { childList: true, subtree: true });
    }

    function applyPreferredLang() {
      var saved = readSavedLang() || DEFAULT_LANG;
      // 源语言无需切换
      if (saved === SOURCE_LANG) return;
      try {
        if (translate.changeLanguage) {
          translate.changeLanguage(saved);
        } else if (translate.selectLanguageTag && translate.selectLanguageTag.change) {
          translate.selectLanguageTag.change(saved);
        }
      } catch (e) { console.warn('changeLanguage failed:', e); }
    }

    function initTranslate() {
      if (typeof translate === 'undefined') return false;
      try { translate.setUseVersion2(); } catch (_) {}
      try { translate.language.setLocal(SOURCE_LANG); } catch (_) {}
      try { translate.selectLanguageTag.languages = ALLOWED; } catch (_) {}
      // setDefaultTo 仅首次访问生效；为了在跳页后仍保持英文，下面用 localStorage 主动切换
      try { translate.language.setDefaultTo(DEFAULT_LANG); } catch (_) {}
      try { translate.listener.start(); } catch (_) {}
      try { translate.execute(); } catch (_) {}
      // 强制应用用户上次选择（或默认英文）
      applyPreferredLang();
      // 再延迟一次，覆盖 translate.js 内部异步初始化
      setTimeout(applyPreferredLang, 300);
      setTimeout(applyPreferredLang, 1200);
      return true;
    }

    function loadNext() {
      if (idx >= URLS.length) {
        if (fb) fb.textContent = 'unavailable (network)';
        return;
      }
      var s = document.createElement('script');
      s.src = URLS[idx++];
      s.async = true;
      s.onload = function () {
        if (typeof translate === 'undefined') { loadNext(); return; }
        initTranslate();
      };
      s.onerror = function () { loadNext(); };
      document.head.appendChild(s);
    }
    loadNext();

    // 8 秒兑底提示：仍未出现 select 时提示网络慢
    setTimeout(function () {
      if (!fb) return;
      if (box && box.querySelector('select')) return;
      if (/loading/.test(fb.textContent)) {
        fb.textContent = '(slow network, please wait…)';
      }
    }, 8000);
  })();
</script>

<script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
    }
  };
</script>

<script>
  (function () {
    function loadScript(urls, onDone) {
      var i = 0;
      function tryNext() {
        if (i >= urls.length) {
          return;
        }
        var url = urls[i++];
        var s = document.createElement('script');
        s.src = url;
        s.async = true;
        s.onload = function () { onDone && onDone(); };
        s.onerror = function () { tryNext(); };
        document.head.appendChild(s);
      }
      tryNext();
    }

    function typesetMath() {
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetClear && window.MathJax.typesetClear();
        window.MathJax.typesetPromise();
      }
    }

    loadScript([
      'https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js',
      'https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js',
      'https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js'
    ], function () {
      typesetMath();
      setTimeout(typesetMath, 500);
      setTimeout(typesetMath, 1500);
    });

    loadScript([
      'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js',
      'https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.9.1/mermaid.min.js',
      'https://unpkg.com/mermaid@10/dist/mermaid.min.js'
    ], function () {
      if (window.mermaid) {
        window.mermaid.initialize({ startOnLoad: false });
      }
    });

    // If translate.js mutates DOM after load, re-typeset once more.
    window.addEventListener('load', function () {
      setTimeout(typesetMath, 2500);
    });
  })();
</script>

<script>
  function renderMermaidFromCodeFences() {
    var blocks = document.querySelectorAll('pre > code.language-mermaid');
    blocks.forEach(function (code) {
      var pre = code.parentElement;
      var container = document.createElement('div');
      container.className = 'mermaid';
      container.textContent = code.textContent;
      pre.parentElement.replaceChild(container, pre);
    });

    if (window.mermaid) {
      window.mermaid.initialize({ startOnLoad: false });
      window.mermaid.run({ querySelector: '.mermaid' });
    }
  }

  window.addEventListener('load', function () {
    renderMermaidFromCodeFences();
  });
</script>
